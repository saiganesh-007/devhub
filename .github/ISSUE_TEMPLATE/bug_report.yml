name: Bug report
description: Report a reproducible problem in DevHub
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DevHub. Please do not include passwords, API keys, tokens, or other secrets.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps.
      placeholder: |
        1. Go to ...
        2. Search for ...
        3. Click ...
        4. See error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, or other relevant environment details.
      placeholder: Chrome / Windows 11 / Node 24
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove all secrets and private information before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed secrets and private information from anything I attached.
          required: true
